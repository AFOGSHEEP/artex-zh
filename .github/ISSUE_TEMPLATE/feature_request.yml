name: 💡 功能建议
description: 建议新功能或改进。
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。填写以下各项有助于我们对齐方向。
  - type: checkboxes
    id: preflight
    attributes:
      label: 确认
      options:
        - label: 已搜索且没有类似的建议处于开放状态。
          required: true
        - label: 本建议不鼓励在授权范围之外或违反适用法律的使用。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 出发点是什么问题或需求
      description: 先描述你想解决的情境。理解问题比方案更重要。
      placeholder: "例如：把检测结果分享给团队时，希望报告能导出为 PDF。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 描述你认为可以如何解决。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 如果想过其他做法，请一并描述。
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 相关领域
      options:
        - 智能体 (agent)
        - Web UI / 服务端 (web / server)
        - LLM 供应商对接
        - 文档 / 翻译
        - 其他
    validations:
      required: false
